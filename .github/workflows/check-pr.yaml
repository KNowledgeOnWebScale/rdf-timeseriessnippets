name: Check PRs against the Bikeshed spec

on:
  # Runs on PRs targeting the default branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build spec
        run: |
          echo "Installing bikeshed"
          pip install bikeshed
          echo "Building spec"
          bikeshed spec spec.bs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Turtle validation
        run: |
          echo "Validating RDF syntax"
          npx --yes --package turtle-validator ttl tss.ttl

